services:
  db:
    image: postgres:16-alpine
    container_name: gear-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gear_shop
    # Map 5433 ra ngoài để không đụng PostgreSQL đang chạy sẵn ở cổng 5432
    ports:
      - "5433:5432"
    volumes:
      - gear_shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gear_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gear_shop_pgdata:
