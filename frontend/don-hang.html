<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đơn hàng — Gear Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Tới nội dung chính</a>

    <header class="site-header" data-site-header></header>

    <main id="main">
      <section class="page-hero">
        <div class="container">
          <nav class="breadcrumb" aria-label="Đường dẫn">
            <a href="index.html">Trang chủ</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page">Đơn hàng</span>
          </nav>
          <h1 class="page-title">Đơn hàng</h1>
          <p class="page-lead">Theo dõi trạng thái, xem lại món đã mua và huỷ đơn đang chờ xử lý.</p>
        </div>
      </section>

      <div class="container orders-page">
        <div class="account-layout">
          <aside class="account-nav" aria-label="Tài khoản">
            <div class="account-nav__user">
              <span class="account-nav__avatar" data-account-avatar aria-hidden="true">GS</span>
              <div>
                <p class="account-nav__name" data-account-name>Khách</p>
                <p class="account-nav__email" data-account-email>Chưa đăng nhập</p>
              </div>
            </div>
            <a href="don-hang.html" aria-current="page">Đơn hàng của tôi</a>
            <a href="gio-hang.html">Giỏ hàng</a>
            <a href="san-pham.html">Tiếp tục mua gear</a>
            <a href="dang-nhap.html" data-logout>Đăng xuất</a>
          </aside>

          <section aria-labelledby="orders-heading">
            <h2 class="section__title" id="orders-heading">Lịch sử đơn hàng</h2>
            <p class="result-count" data-message role="status" aria-live="polite"></p>
            <div data-orders></div>
          </section>
        </div>
      </div>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <script type="module" src="assets/js/orders.js"></script>
  </body>
</html>
